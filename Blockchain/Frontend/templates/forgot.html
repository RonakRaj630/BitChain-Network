{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card fade-in">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="font-size:2.5rem;margin-bottom:0.75rem;">🔐</div>
      <div class="auth-title">Account Recovery</div>
      <div class="auth-sub">Enter your registered email address to receive recovery instructions.</div>
    </div>

    {% if msg %}
    <div class="alert {{ 'alert-error' if '❌' in msg else 'alert-success' }}">{{ msg }}</div>
    {% endif %}

    <form action="{{ url_for('forgot') }}" method="post">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg">Send Recovery Email</button>
    </form>

    <div class="auth-divider">remembered?</div>
    <a href="{{ url_for('login') }}" class="btn btn-outline w-full" style="justify-content:center;">Back to Login</a>
  </div>
</div>
{% endblock %}
