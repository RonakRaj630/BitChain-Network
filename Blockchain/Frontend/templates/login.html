{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card fade-in">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="width:60px;height:60px;background:linear-gradient(135deg,#3b82f6,#a855f7);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 1rem;">⛏️</div>
      <div class="auth-title">Miner Login</div>
      <div class="auth-sub">Access your mining wallet and dashboard</div>
    </div>

    {% if msg %}
    <div class="alert {{ 'alert-error' if '❌' in msg else 'alert-success' }}">
      {{ msg }}
    </div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="post" id="loginForm">
      <div class="form-group">
        <label class="form-label">Bitcoin Address</label>
        <input type="text" name="address" class="form-input mono"
               placeholder="1BgFzbYT..." required autocomplete="off"
               value="{{ prefill_address or '' }}">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <input type="password" name="password" id="passwordInput"
                 class="form-input" placeholder="Your account password" required>
          <button type="button" onclick="togglePwd()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;" id="eyeBtn">👁</button>
        </div>
      </div>

      <div class="flex-between mb-3">
        <label class="checkbox-row">
          <input type="checkbox" name="remember" value="1"> Remember me (7 days)
        </label>
        <a href="{{ url_for('forgot') }}" style="font-size:13px;color:var(--purple);text-decoration:none;">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg">
        🚀 Login &amp; Start Mining
      </button>
    </form>

    <div class="auth-divider">or</div>

    <a href="{{ url_for('register') }}" class="btn btn-outline w-full" style="justify-content:center;">
      Create New Account
    </a>

    <div style="text-align:center;margin-top:1.25rem;font-size:12px;color:var(--text-muted);">
      🔒 Your private key is never stored in plain text
    </div>
  </div>
</div>

<script>
  function togglePwd() {
    const inp = document.getElementById('passwordInput');
    const btn = document.getElementById('eyeBtn');
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
  }
</script>
{% endblock %}
