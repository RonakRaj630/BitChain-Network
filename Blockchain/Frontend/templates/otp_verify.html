{% extends "base.html" %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card fade-in">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="width:60px;height:60px;background:linear-gradient(135deg,#a855f7,#3b82f6);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 1rem;">📧</div>
      <div class="auth-title">Check Your Email</div>
      <div class="auth-sub">
        We sent an 8-character OTP to<br>
        <strong style="color:#a78bfa;">{{ email }}</strong>
      </div>
    </div>

    {% if msg %}
    <div class="alert alert-error">{{ msg }}</div>
    {% endif %}

    <form action="{{ url_for('login') if purpose == 'login' else url_for('forgot') }}" method="post">
      <input type="hidden" name="{{ 'otp_step' if purpose == 'login' else 'reset_step' }}" value="1">

      <div class="form-group">
        <label class="form-label">Enter OTP Code</label>
        <input type="text" name="otp" class="form-input mono"
               placeholder="e.g. aB3xK9mZ"
               maxlength="8" required autocomplete="off"
               style="text-align:center;font-size:1.4rem;letter-spacing:6px;">
        <div style="font-size:12px;color:var(--text-muted);margin-top:0.4rem;text-align:center;">
          ⏱ Expires in 5 minutes
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg">
        ✅ Verify OTP
      </button>
    </form>

    <div class="auth-divider">didn't receive it?</div>

    <!-- Resend OTP -->
    <form action="{{ url_for('resend_otp') }}" method="post" style="margin-bottom:0.75rem;">
      <input type="hidden" name="purpose" value="{{ purpose }}">
      <button type="submit" class="btn btn-ghost w-full" style="justify-content:center;" id="resendBtn">
        🔄 Resend OTP
      </button>
    </form>

    <a href="{{ url_for('login') if purpose == 'login' else url_for('forgot') }}"
       class="btn btn-outline w-full" style="justify-content:center;">
      ← Go Back
    </a>

    {% if resend_msg %}
    <div class="alert {{ 'alert-success' if '✅' in resend_msg else 'alert-error' }}" style="margin-top:1rem;">
      {{ resend_msg }}
    </div>
    {% endif %}
  </div>
</div>

<script>
  document.querySelector('input[name="otp"]').focus();

  // Resend cooldown — disable button for 30s after page load / resend
  var resendBtn = document.getElementById('resendBtn');
  var cooldown  = 30;

  function startCooldown() {
    resendBtn.disabled = true;
    var remaining = cooldown;
    var interval = setInterval(function() {
      remaining--;
      resendBtn.textContent = '🔄 Resend OTP (' + remaining + 's)';
      if (remaining <= 0) {
        clearInterval(interval);
        resendBtn.disabled = false;
        resendBtn.textContent = '🔄 Resend OTP';
      }
    }, 1000);
  }

  startCooldown();

  // OTP expiry countdown
  var expirySecs = 300;
  var expiryEl   = document.querySelector('div[style*="Expires"]');
  setInterval(function() {
    expirySecs--;
    if (expirySecs <= 0 && expiryEl) {
      expiryEl.innerHTML = '⚠️ OTP has expired. Please resend.';
      expiryEl.style.color = '#fca5a5';
    } else if (expiryEl) {
      var m = Math.floor(expirySecs / 60);
      var s = expirySecs % 60;
      expiryEl.innerHTML = '⏱ Expires in <strong style="color:#f1f5f9;">' + m + ':' + (s<10?'0':'') + s + '</strong>';
    }
  }, 1000);
</script>
{% endblock %}
