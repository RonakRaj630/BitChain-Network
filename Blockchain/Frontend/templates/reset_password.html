{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card fade-in">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="width:60px;height:60px;background:linear-gradient(135deg,#22c55e,#3b82f6);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 1rem;">🔑</div>
      <div class="auth-title">Set New Password</div>
      <div class="auth-sub">OTP verified! Enter your Bitcoin address and new password.</div>
    </div>

    {% if msg %}
    <div class="alert {{ 'alert-error' if '❌' in msg else 'alert-success' }}">{{ msg }}</div>
    {% endif %}

    <form action="{{ url_for('forgot') }}" method="post">
      <input type="hidden" name="reset_step" value="2">
      <input type="hidden" name="email" value="{{ email }}">

      <div class="form-group">
        <label class="form-label">Your Bitcoin Address</label>
        <input type="text" name="address" class="form-input mono"
               placeholder="1BgFzbYT..." required value="{{ address }}">
      </div>

      <div class="form-group">
        <label class="form-label">New Password</label>
        <div style="position:relative;">
          <input type="password" name="password" id="pwInput"
                 class="form-input" placeholder="Min 8 characters" required minlength="8">
          <button type="button" onclick="togglePwd()"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;" id="eyeBtn">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-input"
               placeholder="Repeat password" required>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg">
        🔐 Reset Password
      </button>
    </form>
  </div>
</div>
<script>
function togglePwd() {
  var inp = document.getElementById('pwInput');
  var btn = document.getElementById('eyeBtn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}
</script>
{% endblock %}
